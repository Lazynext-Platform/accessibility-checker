name: lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JS/MJS
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || status=1
          done < <(find . \( -name '*.js' -o -name '*.mjs' \) -not -path './node_modules/*' | sort)
          [ "$status" -eq 0 ] && echo "syntax ok" || exit 1
      - name: Validate JSON manifests
        run: node -e "for (const f of ['package.json','manifest.json']) JSON.parse(require('fs').readFileSync(f)); console.log('json ok')"
      - name: Whitespace hygiene
        run: |
          ws=$(grep -rln ' $' --include='*.js' --include='*.mjs' . | grep -v node_modules || true)
          crlf=$(grep -rln $'\r' --include='*.js' --include='*.mjs' . | grep -v node_modules || true)
          if [ -n "$ws$crlf" ]; then
            echo "hygiene violations:"; echo "$ws"; echo "$crlf"; exit 1
          fi
          echo "whitespace ok"
