name: Test and Deploy

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          npm install

      - name: Run tests
        run: |
          npm test

      - name: Build and deploy
        run: |
          npm run build
          npm run deploy

      - name: Test scanner.js
        run: |
          node:test test/scanner.test.mjs

      - name: Test accessibility_checker.py
        run: |
          python -m pytest test/accessibility_checker_test.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./