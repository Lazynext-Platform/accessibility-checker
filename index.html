```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Accessibility Checker</h1>
    <input id="url" type="text" placeholder="Enter website URL">
    <button id="scan-button">Scan for Accessibility Issues</button>
    <div id="result"></div>

    <script type="module">
        import { scanWebsite } from './src/scanner.js';

        const urlInput = document.getElementById('url');
        const scanButton = document.getElementById('scan-button');
        const resultDiv = document.getElementById('result');

        scanButton.addEventListener('click', async () => {
            const url = urlInput.value;
            if (!url) {
                resultDiv.innerText = 'Please enter a website URL';
                return;
            }

            try {
                const result = await scanWebsite(url);
                resultDiv.innerText = 'Accessibility Issues Found:';
                const issueList = document.createElement('ul');
                result.forEach(issue => {
                    const issueItem = document.createElement('li');
                    issueItem.innerText = issue;
                    issueList.appendChild(issueItem);
                });
                resultDiv.appendChild(issueList);
            } catch (error) {
                resultDiv.innerText = 'Error scanning website: ' + error.message;
            }
        });
    </script>
</body>
</html>
```
