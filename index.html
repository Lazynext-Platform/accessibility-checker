```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #results {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Accessibility Checker</h1>
    <input id="website-url" type="text" placeholder="Enter website URL">
    <button id="scan-button">Scan Website</button>
    <div id="results"></div>

    <script src="src/algorithms/wcag-scanner.js"></script>
    <script>
        const websiteUrlInput = document.getElementById('website-url');
        const scanButton = document.getElementById('scan-button');
        const resultsDiv = document.getElementById('results');

        scanButton.addEventListener('click', async () => {
            const websiteUrl = websiteUrlInput.value;
            if (!websiteUrl) {
                alert('Please enter a website URL');
                return;
            }

            try {
                const scanner = new WcagScanner();
                const results = await scanner.scan(websiteUrl);
                const resultsHtml = results.map(result => {
                    return `
                        <h2>${result.issue}</h2>
                        <p>Element: ${result.element}</p>
                        <p>Recommendation: ${result.recommendation}</p>
                    `;
                }).join('');
                resultsDiv.innerHTML = resultsHtml;
            } catch (error) {
                console.error(error);
                alert('Error scanning website');
            }
        });
    </script>
</body>
</html>
