<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Checker — WCAG scanner</title>
    <style>
        :root { font-family: -apple-system, system-ui, sans-serif; }
        body { max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #1a1a2e; }
        h1 { font-size: 1.6rem; }
        .row { display: flex; gap: .5rem; margin: 1.25rem 0; }
        input { flex: 1; padding: .7rem .9rem; border: 1px solid #c9c9d4; border-radius: 8px; font-size: 1rem; }
        button { padding: .7rem 1.2rem; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 1rem; cursor: pointer; }
        button:disabled { opacity: .5; cursor: wait; }
        #score { font-size: 2.4rem; font-weight: 700; }
        .issue { border: 1px solid #e5e5ee; border-left: 4px solid #e11d48; border-radius: 6px; padding: .7rem 1rem; margin: .5rem 0; }
        .rule { font-family: ui-monospace, monospace; font-size: .8rem; color: #6b7280; }
        #status { color: #6b7280; margin-top: 1rem; }
        .ok { color: #059669; font-weight: 600; }
    </style>
</head>
<body>
    <h1>Accessibility Checker</h1>
    <p>Scan any public page for WCAG accessibility issues — rendered in a real browser engine.</p>
    <div class="row">
        <input id="url" type="url" placeholder="https://example.com" aria-label="Website URL">
        <button id="go">Scan</button>
    </div>
    <div id="status"></div>
    <div id="out"></div>
    <script>
        const API = "https://accessibility-checker.dry-hall-6a50.workers.dev/scan";
        const urlEl = document.getElementById("url"), go = document.getElementById("go");
        const statusEl = document.getElementById("status"), out = document.getElementById("out");
        go.addEventListener("click", async () => {
            const url = urlEl.value.trim();
            if (!/^https?:\/\//i.test(url)) { statusEl.textContent = "Enter a full URL (https://…)"; return; }
            go.disabled = true; statusEl.textContent = "Rendering page and scanning…"; out.innerHTML = "";
            try {
                const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url }) });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || r.statusText);
                statusEl.innerHTML = `Score: <span id="score">${d.score}</span>/100` + (d.rendered ? " · rendered" : " · static");
                out.innerHTML = d.issues.length
                    ? d.issues.map(i => `<div class="issue"><div class="rule">${i.rule ?? "issue"}</div>${i.message}</div>`).join("")
                    : '<p class="ok">No issues found — nice work.</p>';
            } catch (e) {
                statusEl.textContent = "Scan failed: " + e.message;
            } finally {
                go.disabled = false;
            }
        });
        urlEl.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
    </script>
</body>
</html>
