```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #result {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Accessibility Checker</h1>
    <input id="url" type="text" placeholder="Enter website URL">
    <button id="scan-button">Scan for Accessibility Issues</button>
    <div id="result"></div>

    <script src="src/algorithms/wcag-scanner.js"></script>
    <script>
        const urlInput = document.getElementById('url');
        const scanButton = document.getElementById('scan-button');
        const resultDiv = document.getElementById('result');

        scanButton.addEventListener('click', async () => {
            const url = urlInput.value;
            if (!url) {
                resultDiv.innerText = 'Please enter a website URL';
                return;
            }

            try {
                const scanner = new WCAGScanner();
                const result = await scanner.scan(url);
                resultDiv.innerText = '';
                result.forEach(issue => {
                    const issueElement = document.createElement('p');
                    issueElement.innerText = `${issue.code}: ${issue.message} (${issue.severity})`;
                    resultDiv.appendChild(issueElement);
                });
            } catch (error) {
                resultDiv.innerText = `Error scanning website: ${error.message}`;
            }
        });
    </script>
</body>
</html>
