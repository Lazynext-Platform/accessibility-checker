```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Accessibility Checker</h1>
    <input id="website-url" type="text" placeholder="Enter website URL">
    <button id="scan-button">Scan Website</button>
    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.7.0/dist/tf.min.js"></script>
    <script src="src/scanner.js"></script>
    <script src="src/api/website_scanner.js"></script>
    <script src="src/modules/scanner/ai_scanner.js"></script>
    <script>
        const websiteUrlInput = document.getElementById('website-url');
        const scanButton = document.getElementById('scan-button');
        const resultsDiv = document.getElementById('results');

        scanButton.addEventListener('click', async () => {
            const websiteUrl = websiteUrlInput.value;
            if (!websiteUrl) {
                alert('Please enter a website URL');
                return;
            }

            const scanner = new AiScanner();
            const results = await scanner.scanWebsite(websiteUrl);

            const resultsHtml = results.map(result => {
                return `
                    <h2>${result.issue}</h2>
                    <p>Recommendation: ${result.recommendation}</p>
                `;
            }).join('');

            resultsDiv.innerHTML = resultsHtml;
        });
    </script>
</body>
</html>
```
